name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Changesets v3 requires Node ^22.11 || ^24 || >=26. Use Node 24
      # for tooling and trusted publishing; published packages still support
      # Node 20, covered by the separate package compatibility job in ci.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Create Release PR or Publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Preserve v1's Git CLI pushes rather than switching commit/tag identity.
          push-with-git-cli: true
        env:
          NPM_CONFIG_PROVENANCE: true
