name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-guard:
    name: Docs Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate OpenClaw docs anchors
        run: bash .github/scripts/check-openclaw-docs.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (retry on transient network failures)
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (retry on transient network failures)
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (retry on transient network failures)
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Run tests
        run: pnpm test

      - name: Validate release tooling without publishing
        run: pnpm test:release

  node20-packages:
    name: Node 20 Package Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with supported tooling Node
        run: bash .github/scripts/pnpm-install-with-retry.sh
      - name: Build published packages
        run: pnpm --filter @memories.sh/core --filter @memories.sh/ai-sdk --filter @memories.sh/cli build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test published packages on Node 20
        run: pnpm --filter @memories.sh/core --filter @memories.sh/ai-sdk --filter @memories.sh/cli test
      - name: Smoke test CLI on Node 20
        run: node packages/cli/dist/index.js --help

  workspace-switch-budgets:
    name: Workspace Switch Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (retry on transient network failures)
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Enforce workspace-switch p50/p95 budgets
        run: pnpm --filter @memories.sh/web test src/lib/workspace-switch-performance.test.ts

  sdk-contracts:
    name: SDK Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (retry on transient network failures)
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Run SDK contract snapshot tests
        run: pnpm --filter @memories.sh/web test:sdk-contracts

  build:
    name: Build
    needs: [docs-guard, lint, typecheck, test, node20-packages, workspace-switch-budgets, sdk-contracts]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (retry on transient network failures)
        run: bash .github/scripts/pnpm-install-with-retry.sh

      - name: Build
        run: pnpm build
